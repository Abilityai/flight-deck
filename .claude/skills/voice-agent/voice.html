<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Voice Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --ink: rgba(225,235,250,.92); --dim: rgba(150,180,225,.6); --line: rgba(90,140,210,.25); --blue: rgba(70,140,220,.28); }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: var(--ink); font: 15px/1.45 system-ui, sans-serif; overflow: hidden; }
    canvas { position: fixed !important; inset: 0; z-index: 0; mix-blend-mode: screen; }
    #face { z-index: 3; mix-blend-mode: normal; pointer-events: none; width: 100vw; height: 100vh; }
    #portrait { position: fixed; z-index: 2; pointer-events: none; border-radius: 50%; overflow: hidden; will-change: transform;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 58%, transparent 71%); mask-image: radial-gradient(circle at 50% 50%, #000 58%, transparent 71%); }
    html.fx-dust #portrait { border-radius: 0; filter: url(#dustwarp);   /* a face of dust: no round frame, edges that thin out, a faint waver */
      -webkit-mask-image: radial-gradient(circle at 50% 47%, #000 34%, transparent 66%); mask-image: radial-gradient(circle at 50% 47%, #000 34%, transparent 66%); }
    html.fx-dust #portrait img { transition: opacity 2.2s ease-in-out !important; }
    html.fx-dust #talk { transition: opacity 1.1s ease-in-out; }
    #portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease-in-out; user-select: none; }
    #talk { position: absolute !important; inset: 0; width: 100%; height: 100%; z-index: 10; mix-blend-mode: normal; opacity: 0; transition: opacity .45s ease-in-out; }   /* the speaking face comes in over the portrait as softly as portraits change */
    #talk.on { opacity: 1; }
    #ring { position: fixed; z-index: 1; pointer-events: none; border-radius: 50%; transform: scale(.74); }
    #mood { position: fixed; z-index: 2; left: 0; text-align: center; color: var(--dim); font-size: 11px; letter-spacing: .32em; text-transform: uppercase; pointer-events: none; }
    #now { color: rgba(190,215,250,.85); font-size: 13px; min-height: 18px; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .6s; }
    #facebtn.on { background: rgba(70,140,220,.22); }
    /* Ambient: a low glow whose colour follows the time of day and the weather, a hairline that fills with the
       day of the month, and one small line of text saying what it stands for. Set by the ambient block in voice.js. */
    #ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; transition: background 4s linear;
      background: radial-gradient(120% 55% at 50% 112%, var(--amb, transparent) 0%, transparent 70%), linear-gradient(180deg, var(--ambtop, transparent) 0%, transparent 30%); }
    #month { position: fixed; z-index: 2; left: 0; top: 0; height: 2px; width: calc(100% - 440px); background: rgba(255,255,255,.07); pointer-events: none; }
    #month i { display: block; height: 100%; background: var(--ambline, rgba(150,180,225,.6)); transition: width 1s, background 4s linear; }
    #ambchip { position: fixed; z-index: 2; left: 16px; top: 12px; color: var(--dim); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
    #ambchip b { font-weight: 600; color: var(--ambline, var(--dim)); transition: color 4s linear; }
    html.embed #ambchip, html.embed #month { display: none; }
    @media (max-width: 800px) { #month { width: 100%; } #ambchip { display: none; } }
    #stage { position: fixed; z-index: 2; left: 0; bottom: 28px; width: calc(100% - 440px); display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #state { color: var(--dim); letter-spacing: .05em; font-size: 14px; min-height: 20px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button, select { padding: 10px 16px; font: inherit; color: #fff; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; cursor: pointer; }
    button:hover { background: rgba(255,255,255,.14); }
    #start { background: var(--blue); }
    #mute { padding: 5px; width: 26px; height: 26px; line-height: 0; border-radius: 50%; background: none; border-color: transparent; opacity: .35; vertical-align: middle; }
    #mute:hover { opacity: .8; background: rgba(255,255,255,.08); }
    #mute svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #mute .slash { display: none; }
    #mute.on { opacity: .9; color: #f0a060; background: rgba(200,120,60,.25); }
    #mute.on .slash { display: inline; }
    #yolo.on { background: rgba(220,160,40,.45); border-color: rgba(240,190,80,.8); }
    #end { background: rgba(180,70,70,.22); }
    #panel { position: fixed; z-index: 3; top: 0; right: 0; bottom: 0; width: 440px; display: flex; flex-direction: column; background: rgba(6,10,18,.88); border-left: 1px solid var(--line); }
    #head { padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; gap: 10px; }
    #log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .m { white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { color: #cfe3ff; border-left: 2px solid rgba(120,180,255,.7); padding-left: 10px; }
    .said { color: var(--ink); }
    .fixed, .tool, .notice { color: var(--dim); font-size: 13px; }
    .err { color: #ff9c9c; font-size: 13px; }
    .screen { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
    .screen a { color: #8fc1ff; }
    .md { white-space: normal; }
    .md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
    .md .h { font-weight: 600; color: #fff; margin: 8px 0 4px; }
    .md ul, .md ol { margin: 4px 0 8px; padding-left: 20px; } .md li { margin: 2px 0; }
    .md code { font: 12px ui-monospace, monospace; background: rgba(255,255,255,.08); padding: 1px 4px; border-radius: 4px; }
    .md pre { white-space: pre-wrap; font: 12px ui-monospace, monospace; background: rgba(0,0,0,.35); padding: 8px; border-radius: 6px; margin: 6px 0; overflow-x: auto; }
    .md table { border-collapse: collapse; margin: 6px 0; font-size: 12px; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
    .md th { color: #fff; } .md hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
    .perm { background: rgba(200,150,50,.12); border: 1px solid rgba(220,170,70,.5); border-radius: 8px; padding: 12px; }
    .perm pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; max-height: 220px; overflow: auto; margin: 8px 0; }
    .perm .row { justify-content: flex-start; }
    .perm .ok { background: rgba(70,160,100,.4); }
    #sessbtn { padding: 3px 9px; font-size: 12px; }
    #sessions { position: absolute; z-index: 5; top: 44px; left: 8px; right: 8px; max-height: 70vh; overflow-y: auto; background: rgba(10,16,28,.98); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
    #sessions .s { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
    #sessions .s:hover { background: rgba(255,255,255,.08); }
    #sessions .s.cur { border-left: 2px solid rgba(120,180,255,.8); }
    #sessions .t { color: var(--ink); font-size: 14px; }
    #sessions .d { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sessions .tag { font-size: 11px; color: #ffd38a; margin-left: 6px; }
    /* Shown in a frame by Flight Deck: one fixed character and voice, the face always on, and
       start / stop driven by the host page's own button and hotkey. */
    html.embed #voice, html.embed #faceset, html.embed #facebtn, html.embed #start, html.embed #end, html.embed #toterm, html.embed #yolo { display: none !important; }   /* always YOLO there */
    html.embed #panel { width: 380px; } html.embed #stage { width: calc(100% - 380px); }
    @media (max-width: 800px) {
      #panel { width: 100%; top: 34%; border-left: 0; border-top: 1px solid var(--line); }
      #stage { width: 100%; top: 8px; bottom: auto; padding: 0 16px; }
      #mood { display: none; }
    }
    /* In the frame the chat sits on the LEFT of the face, and stays beside it down to a 560px frame
       (half of a laptop screen); only narrower than that does it drop under the face. */
    @media (min-width: 561px) {
      html.embed #panel { top: 0; left: 0; right: auto; border: 0; border-right: 1px solid var(--line); }
      html.embed #stage { left: 380px; top: auto; bottom: 28px; padding: 0; }
      html.embed #mood { display: block; }
    }
    @media (min-width: 561px) and (max-width: 800px) {
      html.embed #panel { width: 300px; } html.embed #stage { left: 300px; width: calc(100% - 300px); }
    }
    /* A small corner frame (Flight Deck's TRINITY view): the face on top, the chat under it across the
       whole width, in a smaller size. The fixed 380px panel above is for the wide frame only: here it
       would hang off the left edge and cut the text. */
    @media (max-width: 560px) {
      html.embed #panel { width: 100%; left: 0; right: 0; top: 42%; border: 0; border-top: 1px solid var(--line); }
      html.embed #stage { width: 100%; left: 0; top: 31%; bottom: auto; padding: 0 8px; gap: 8px; flex-direction: row; justify-content: center; }   /* under the face: the state and the mute button on one line */
      html.embed #now { display: none; }
      html.embed #head { display: none; }
      html.embed #log { padding: 8px 10px; gap: 7px; font-size: 12.5px; line-height: 1.4; }
      html.embed .fixed, html.embed .tool, html.embed .notice, html.embed .err { font-size: 11px; }
      html.embed #state { font-size: 11px; min-height: 14px; } html.embed #now { font-size: 11px; min-height: 14px; }
      html.embed #mood { display: none; }
    }
    /* Skin "dusk": only when the page that frames this one asks for it (Flight Deck's /dusk copy sends
       {skin: "dusk"}); without that message nothing here applies. Colours and lettering only. */
    html.skin-dusk { --ink: #f3eef8; --dim: rgba(196,182,220,.66); --line: rgba(255,255,255,.12); --blue: rgba(255,79,134,.25); }
    html.skin-dusk body { background: #08060f; font-family: "Avenir Next", system-ui, sans-serif; }
    html.skin-dusk #panel { background: linear-gradient(180deg, rgba(20,12,32,.94), rgba(28,13,36,.94)); }
    html.skin-dusk #head { align-items: center; font: 700 italic 12px/1 "Avenir Next Condensed", "Arial Narrow", sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    html.skin-dusk #cost { font-size: 19px; letter-spacing: .01em; color: #8ff0b4; text-transform: none; }
    html.skin-dusk #log { scrollbar-width: thin; scrollbar-color: rgba(255,79,134,.5) transparent; gap: 12px; font-size: 14.5px; line-height: 1.5; }
    html.skin-dusk .user { color: #ffe3ee; border-left: 2px solid; border-image: linear-gradient(180deg, #ff4f86, #ff7a45) 1; }
    html.skin-dusk .fixed, html.skin-dusk .tool, html.skin-dusk .notice { font-size: 12.5px; }
    html.skin-dusk .tool::before { content: "▸ "; color: #ff4f86; }
    html.skin-dusk .screen { background: rgba(255,255,255,.045); border-radius: 14px; padding: 12px 14px; }
    html.skin-dusk .screen a { color: #45d6c8; }
    html.skin-dusk .md pre { background: rgba(0,0,0,.3); border-radius: 10px; scrollbar-width: thin; scrollbar-color: rgba(255,79,134,.5) transparent; }
    html.skin-dusk .perm { background: rgba(242,193,78,.08); border-color: rgba(242,193,78,.45); border-radius: 14px; }
    html.skin-dusk .perm .ok { background: #f2c14e; color: #261600; border-color: transparent; }
    html.skin-dusk button, html.skin-dusk select { border-radius: 999px; }
    html.skin-dusk #sessbtn, html.skin-dusk .perm button { font: 700 11px/1 "Avenir Next Condensed", "Arial Narrow", sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 6px 13px; }
    html.skin-dusk #sessions { background: rgba(20,12,32,.98); border-radius: 14px; scrollbar-width: thin; scrollbar-color: rgba(255,79,134,.5) transparent; }
    html.skin-dusk #sessions .s.cur { border-left-color: #ff4f86; }
    html.skin-dusk #now { color: rgba(243,238,248,.8); }
    html.skin-dusk #mood { color: #45d6c8; font: 600 11px/1 "Avenir Next Condensed", "Arial Narrow", sans-serif; letter-spacing: .34em; }
    html.skin-dusk #mood[data-name]::before { content: attr(data-name); display: block; margin-bottom: 8px; color: #f3eef8; font: 700 italic 22px/1 "Avenir Next Condensed", "Arial Narrow", sans-serif; letter-spacing: .08em; }
  </style>
</head>
<body>
  <div id="ambient"></div>
  <div id="month"><i></i></div>
  <div id="ambchip"></div>
  <div id="mood"></div>
  <div id="stage">
    <div id="now"></div>
    <div id="state">press start, then talk</div>
    <div class="row">
      <button id="start">Start talking</button>
      <button id="mute" hidden title="Mute mic" aria-label="Mute mic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg></button>
      <select id="voice" aria-label="Voice"></select>
      <button id="yolo" title="YOLO: approve every tool automatically. Send tools stay removed.">YOLO on</button>
      <select id="faceset" aria-label="Avatar" title="Which face speaks"></select>
      <button id="facebtn" title="Show or hide the face and the trail of what Claude Code is doing">Face on</button>
      <button id="toterm" title="End the voice session and continue this same conversation in a new iTerm tab">Continue in iTerm</button>
      <button id="end">End session</button>
    </div>
  </div>
  <aside id="panel">
    <div id="head"><span><span id="engine">Claude Code</span> <button id="sessbtn" title="Resume another session">Sessions</button></span><span id="cost"></span></div>
    <div id="sessions" hidden></div>
    <div id="log" aria-live="polite"></div>
  </aside>
  <script src="/voice.js"></script>
  <script src="/vendor/p5.min.js"></script>
  <script src="/orb_sketch.js"></script>
  <script src="/face.js"></script>
</body>
</html>
